<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 60px 120px;
          color: #edeae4;
          font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        }
        .bi-grid {
          display: grid;
          grid-template-columns: 720px 480px;
          gap: 36px;
          width: 100%;
          max-width: 1240px;
          align-items: center;
        }
        .chart-panel {
          background: #252420;
          border: 1px solid #3a3834;
          border-radius: 20px;
          padding: 32px;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .chart-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 28px;
        }
        .chart-title {
          font-size: 20px;
          font-weight: 700;
          color: #ffffff;
        }
        .chart-legend {
          display: flex;
          gap: 16px;
          font-size: 13px;
          color: #b0aaa0;
        }
        .legend-item {
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .legend-box {
          width: 10px;
          height: 10px;
          border-radius: 2px;
        }
        .bar-chart-wrap {
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        .bar-row {
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        .bar-row-meta {
          display: flex;
          justify-content: space-between;
          font-size: 15px;
          font-weight: 500;
          color: #edeae4;
        }
        .bar-track {
          height: 24px;
          background: #1c1b18;
          border-radius: 6px;
          overflow: hidden;
          display: flex;
        }
        .bar-fill-rev {
          background: #f2d252;
          height: 100%;
          border-radius: 6px 0 0 6px;
        }
        .bar-fill-loss {
          background: #e07a6e;
          height: 100%;
          border-radius: 0 6px 6px 0;
        }
        .insight-panel {
          display: flex;
          flex-direction: column;
          gap: 20px;
        }
        .ground-badge {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 10px 18px;
          background: rgba(78, 159, 110, 0.15);
          border: 1px solid #4e9f6e;
          border-radius: 999px;
          color: #6bbf8c;
          font-size: 15px;
          font-weight: 600;
          width: fit-content;
        }
        .insight-card {
          background: #252420;
          border: 1px solid #3a3834;
          border-radius: 18px;
          padding: 26px;
        }
        .insight-lead {
          font-size: 22px;
          font-weight: 700;
          line-height: 1.35;
          color: #ffffff;
          margin-bottom: 14px;
        }
        .insight-desc {
          font-size: 16px;
          line-height: 1.55;
          color: #b0aaa0;
        }
        .insight-actions {
          display: flex;
          gap: 12px;
          margin-top: 18px;
        }
        .action-pill {
          padding: 8px 16px;
          background: #33312c;
          border: 1px solid #45423b;
          border-radius: 8px;
          font-size: 14px;
          font-weight: 600;
          color: #edeae4;
        }
      </style>

      <div
        id="root"
        data-composition-id="scene-3"
        data-width="1920"
        data-height="1080"
      >
        <div class="bi-grid" id="s3-content">
          <div class="chart-panel" id="s3-chart">
            <div class="chart-header">
              <div class="chart-title">Unprofitable Products (>20% Discount)</div>
              <div class="chart-legend">
                <div class="legend-item">
                  <div class="legend-box" style="background:#f2d252"></div>
                  <span>Revenue</span>
                </div>
                <div class="legend-item">
                  <div class="legend-box" style="background:#e07a6e"></div>
                  <span>Loss</span>
                </div>
              </div>
            </div>
            <div class="bar-chart-wrap">
              <div class="bar-row">
                <div class="bar-row-meta">
                  <span>Office Pro Desk</span>
                  <span style="color:#e07a6e">-$4,820 loss</span>
                </div>
                <div class="bar-track">
                  <div class="bar-fill-rev" style="width: 65%;"></div>
                  <div class="bar-fill-loss" style="width: 35%;"></div>
                </div>
              </div>
              <div class="bar-row">
                <div class="bar-row-meta">
                  <span>Laser Jet 5000</span>
                  <span style="color:#e07a6e">-$3,150 loss</span>
                </div>
                <div class="bar-track">
                  <div class="bar-fill-rev" style="width: 72%;"></div>
                  <div class="bar-fill-loss" style="width: 28%;"></div>
                </div>
              </div>
              <div class="bar-row">
                <div class="bar-row-meta">
                  <span>Ultra Ergonomic Chair</span>
                  <span style="color:#e07a6e">-$1,940 loss</span>
                </div>
                <div class="bar-track">
                  <div class="bar-fill-rev" style="width: 80%;"></div>
                  <div class="bar-fill-loss" style="width: 20%;"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="insight-panel" id="s3-insight">
            <div class="ground-badge" id="s3-ground">
              <span>✓ Grounded in 142 Postgres rows</span>
              <span>• 0 Hallucinations</span>
            </div>
            <div class="insight-card">
              <div class="insight-lead">
                3 products operate at a loss after deep discounts.
              </div>
              <p class="insight-desc">
                Discounts exceeding 25% eliminate profit margins across office furniture and printers. Top loss driver is Office Pro Desk.
              </p>
              <div class="insight-actions">
                <div class="action-pill">★ Saved insight</div>
                <div class="action-pill">View query details</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#s3-chart", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
        tl.fromTo("#s3-insight", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.3);
        tl.fromTo(".bar-fill-rev", { scaleX: 0 }, { scaleX: 1, transformOrigin: "left", duration: 0.7, ease: "power2.out" }, 0.6);
        tl.fromTo(".bar-fill-loss", { scaleX: 0 }, { scaleX: 1, transformOrigin: "left", duration: 0.6, ease: "power2.out" }, 1.1);
        tl.fromTo("#s3-ground", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 1.24);

        tl.to("#s3-content", { opacity: 0, scale: 0.96, duration: 0.5, ease: "power2.in" }, 6.5);

        window.__timelines["scene-3"] = tl;
      </script>
    </template>
  </body>
</html>
